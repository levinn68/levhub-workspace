name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # NOTE: no `cache: npm` here on purpose. This repository has no
      # package-lock.json, and setup-node fails the whole job when the
      # configured cache-dependency-path does not exist. That alone was
      # failing CI in ~6 seconds, long before any build ran.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # This is an npm-workspaces monorepo. Install from the repository root so
      # workspace linking (apps/api + apps/web) resolves correctly.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript build (API)
        run: npm run build --workspace @levhub/api

      - name: Unit tests (API)
        run: npm run test --workspace @levhub/api

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Production build (web)
        run: npm run build --workspace @levhub/web
        env:
          LEVHUB_API_INTERNAL_URL: http://localhost:4000
          NEXT_TELEMETRY_DISABLED: '1'
