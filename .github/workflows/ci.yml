name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API build & tests
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: apps/api }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Install
        run: npm install --no-audit --no-fund
      - name: TypeScript build
        run: npm run build
      - name: Tests
        run: npm test

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: apps/web }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Production build
        run: npm run build
        env:
          LEVHUB_API_INTERNAL_URL: http://localhost:4000
